version: 1

cases:
  - id: feature-local-debug-tenant-mismatch-cancel
    scenarioId: SCN-CREATE-DEFAULT-BOT-01
    workItemIds: [33849529]
    steps:
      [
        scaffold-simple-bot-ts,
        check-simple-bot-ts,
        login-m365,
        f5-teams-local,
        open-app,
        close-debug-browser,
        switch-m365-account,
        cancel-mismatched-launch,
      ]
  - id: feature-local-debug-tenant-mismatch-continue
    scenarioId: SCN-CREATE-DEFAULT-BOT-01
    workItemIds: [33849529]
    steps:
      [
        scaffold-simple-bot-ts,
        check-simple-bot-ts,
        login-m365,
        f5-teams-local,
        open-app,
        close-debug-browser,
        switch-m365-account,
        continue-mismatched-launch,
        open-app,
        check-recovered-chat,
      ]

steps:
  scaffold-simple-bot-ts:
    type: scaffold
    with:
      template: default-bot
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: teams-other-app-type
        - question: teamsOtherAppType
          value: default-bot
        - question: language
          value: typescript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-simple-bot-ts:
    type: checks
    with:
      - type: file
        path: app.ts
        expect:
          contains: [Default echo behavior]
      - type: file
        path: .vscode/launch.json
        expect:
          contains:
            [
              '"name": "Debug in Teams (Chrome)"',
              '"stopAll": true',
              cascadeTerminateToConfigurations,
            ]

  login-m365:
    type: login
    with:
      type: m365
      account: "${{env:M365_ACCOUNT_NAME}}"
      password: "${{secret:M365_ACCOUNT_PASSWORD}}"

  f5-teams-local:
    type: target
    with:
      profile: Debug in Teams (Chrome)
      profileSelection: first

  open-app:
    type: open
    with:
      kind: app
      destination: chat

  close-debug-browser:
    type: closeDebugBrowser
    with: {}

  switch-m365-account:
    type: switchM365Account
    with:
      account: "${{env:MS_AZURE_ACCOUNT_NAME}}"
      password: "${{secret:MS_AZURE_ACCOUNT_PASSWORD}}"

  cancel-mismatched-launch:
    type: target
    with:
      profile: Debug in Teams (Chrome)
      profileSelection: first
      tenantMismatch: cancel

  continue-mismatched-launch:
    type: target
    with:
      profile: Debug in Teams (Chrome)
      profileSelection: first
      tenantMismatch: continue

  check-recovered-chat:
    type: checks
    with:
      - type: chat
        send: test
        expect:
          replied: true
          contains: ["you said: test"]
